<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Web UTS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        /* NAVIGASI */
        nav {
            background-color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }
        .logo { color: white; font-size: 20px; font-weight: bold; }
        .menu { display: flex; list-style: none; margin: 0; padding: 0; gap: 20px; }
        .menu a { color: white; text-decoration: none; font-weight: 500; }
        .menu a:hover { color: #1abc9c; }

        /* BOX FORM LOGIN */
        .login-box {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            margin-top: 0;
            text-align: center;
            color: #2c3e50;
        }

        /* FORM FIELD, MARGIN & PADDING */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box; /* Agar padding tidak merusak lebar input */
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* TOMBOL LOGIN */
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login:hover {
            background-color: #1abc9c;
        }

        /* AREA PESAN JAVASCRIPT */
        #pesan {
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
            display: none; /* Sembunyi secara default */
        }

        .sukses {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #2c3e50;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">MyWebsite</div>
        <ul class="menu">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <div class="login-box">
        <h2>Form Login</h2>
        
        <!-- FORM LOGIN -->
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <!-- KOTAK PESAN (JS) -->
        <div id="pesan"></div>
    </div>

    <footer>
        <p>&copy; 2026 UTS Pemrograman Web - All Rights Reserved</p>
    </footer>

    <!-- JAVASCRIPT UNTUK MEMPROSES FORM LOGIN -->
    <script>
        document.getElementById("loginForm")
    .addEventListener("submit", function(event) {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const pesanBox = document.getElementById("pesan");
        if (username === "admin" && password === "12345") {
            pesanBox.textContent = "Anda berhasil login!";
            pesanBox.className = "sukses";
            pesanBox.style.display = "block";
            alert("Anda berhasil login!");
        } else {
            pesanBox.textContent = "Login gagal! Username atau password salah.";
            pesanBox.className = "gagal";
            pesanBox.style.display = "block";
            alert("Login gagal! Periksa username dan password Anda.");
        }

    });
    </script>

</body>
</html>
